<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10K Pushup Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anton&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF4500;
            --secondary: #1a1a1a;
            --accent: #FFD700;
            --bg: #0a0a0a;
            --card-bg: #141414;
            --text: #ffffff;
            --text-muted: #888888;
            --success: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 69, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 69, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Anton', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 40px rgba(255, 69, 0, 0.3);
        }

        .subtitle {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            color: var(--text-muted);
            letter-spacing: 3px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .stat-card {
            background: var(--card-bg);
            border: 2px solid rgba(255, 69, 0, 0.2);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .stat-card:hover::before {
            transform: scaleX(1);
        }

        .stat-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(255, 69, 0, 0.3);
        }

        .stat-label {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-family: 'Anton', sans-serif;
            font-size: 3rem;
            color: var(--primary);
            line-height: 1;
        }

        .stat-card.total .stat-value {
            font-size: 4rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .progress-section {
            background: var(--card-bg);
            border: 2px solid rgba(255, 69, 0, 0.2);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        .progress-bar-container {
            background: rgba(255, 255, 255, 0.05);
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 15px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            text-align: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .progress-percent {
            color: var(--primary);
            font-size: 1.5rem;
        }

        .input-section {
            background: var(--card-bg);
            border: 2px solid rgba(255, 69, 0, 0.2);
            border-radius: 12px;
            padding: 30px;
            animation: fadeIn 0.8s ease-out 0.6s both;
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        input[type="number"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 69, 0, 0.3);
            border-radius: 8px;
            padding: 15px 20px;
            font-family: 'Barlow', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.3);
        }

        button {
            background: linear-gradient(135deg, var(--primary) 0%, #ff6a33 100%);
            border: none;
            border-radius: 8px;
            padding: 15px 40px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 69, 0, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        button span {
            position: relative;
            z-index: 1;
        }

        .quick-add {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-add button {
            padding: 12px;
            font-size: 1.1rem;
            background: rgba(255, 69, 0, 0.1);
            border: 2px solid rgba(255, 69, 0, 0.3);
        }

        .quick-add button:hover {
            background: linear-gradient(135deg, var(--primary) 0%, #ff6a33 100%);
            border-color: var(--primary);
        }

        .reset-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            margin-top: 20px;
        }

        .reset-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.5);
        }

        .celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-family: 'Anton', sans-serif;
            font-size: 5rem;
            color: var(--accent);
            text-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
            z-index: 1000;
            pointer-events: none;
            animation: celebrate 2s ease-out;
        }

        @keyframes celebrate {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(-180deg);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(0) rotate(180deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .stat-card.total .stat-value {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>10K Challenge</h1>
            <div class="subtitle">Pushup Tracker</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-label">Total Pushups</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Remaining</div>
                <div class="stat-value" id="remainingCount">10,000</div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%"></div>
            </div>
            <div class="progress-text">
                <span class="progress-percent" id="progressPercent">0%</span> Complete
            </div>
        </div>

        <div class="input-section">
            <div class="quick-add">
                <button onclick="addPushups(10)"><span>+10</span></button>
                <button onclick="addPushups(20)"><span>+20</span></button>
                <button onclick="addPushups(25)"><span>+25</span></button>
                <button onclick="addPushups(50)"><span>+50</span></button>
                <button onclick="addPushups(100)"><span>+100</span></button>
            </div>
            
            <div class="input-group">
                <input type="number" id="customAmount" placeholder="Custom amount" min="1" max="10000">
                <button onclick="addCustom()"><span>Add</span></button>
            </div>

            <button class="reset-btn" onclick="resetChallenge()"><span>Reset Challenge</span></button>
        </div>
    </div>

    <script>
        const GOAL = 10000;
        let totalPushups = 0;

        // Load saved data
        function loadData() {
            const saved = localStorage.getItem('pushupChallenge');
            if (saved) {
                totalPushups = parseInt(saved);
                updateDisplay();
            }
        }

        // Save data
        function saveData() {
            localStorage.setItem('pushupChallenge', totalPushups.toString());
        }

        // Add pushups
        function addPushups(amount) {
            const previousTotal = totalPushups;
            totalPushups = Math.min(totalPushups + amount, GOAL);
            saveData();
            updateDisplay();
            
            // Check for milestone
            if (previousTotal < GOAL && totalPushups >= GOAL) {
                showCelebration('🎉 GOAL COMPLETE! 🎉');
            } else if (totalPushups % 1000 === 0 && totalPushups > 0) {
                showCelebration(`${totalPushups} 💪`);
            }
        }

        // Add custom amount
        function addCustom() {
            const input = document.getElementById('customAmount');
            const amount = parseInt(input.value);
            
            if (amount && amount > 0) {
                addPushups(amount);
                input.value = '';
            }
        }

        // Update display
        function updateDisplay() {
            const remaining = GOAL - totalPushups;
            const percent = Math.round((totalPushups / GOAL) * 100);

            document.getElementById('totalCount').textContent = totalPushups.toLocaleString();
            document.getElementById('remainingCount').textContent = remaining.toLocaleString();
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = percent + '%';
        }

        // Show celebration
        function showCelebration(text) {
            const celebration = document.createElement('div');
            celebration.className = 'celebration';
            celebration.textContent = text;
            document.body.appendChild(celebration);
            
            setTimeout(() => {
                celebration.remove();
            }, 2000);
        }

        // Reset challenge
        function resetChallenge() {
            if (confirm('Are you sure you want to reset your progress? This cannot be undone.')) {
                totalPushups = 0;
                saveData();
                updateDisplay();
            }
        }

        // Handle Enter key on custom input
        document.getElementById('customAmount').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addCustom();
            }
        });

        // Initialize
        loadData();
    </script>
</body>
</html>
