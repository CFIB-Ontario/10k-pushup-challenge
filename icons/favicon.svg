<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="#FF4500"/>
  
  <!-- Dumbbell design -->
  <!-- Left weight -->
  <rect x="15" y="50" width="18" height="28" rx="2" fill="#FFD700"/>
  <rect x="18" y="48" width="12" height="32" rx="1" fill="#FFA500"/>
  
  <!-- Bar -->
  <rect x="33" y="60" width="62" height="8" rx="2" fill="#333"/>
  
  <!-- Right weight -->
  <rect x="95" y="50" width="18" height="28" rx="2" fill="#FFD700"/>
  <rect x="98" y="48" width="12" height="32" rx="1" fill="#FFA500"/>
  
  <!-- Accent lines for depth -->
  <line x1="20" y1="55" x2="20" y2="73" stroke="#FFEB3B" stroke-width="2" opacity="0.6"/>
  <line x1="103" y1="55" x2="103" y2="73" stroke="#FFEB3B" stroke-width="2" opacity="0.6"/>
  
  <!-- Highlight on bar -->
  <rect x="35" y="61" width="58" height="3" rx="1" fill="#555" opacity="0.5"/>
</svg>
